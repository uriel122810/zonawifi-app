<!DOCTYPE html>
<html>
<head>
    <title>Zona Wi-Fi Hotspot</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #1FA2FF 0%, #12D8FA 100%); min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; padding: 15px; }
        .card { background: white; width: 100%; max-width: 380px; padding: 30px 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); text-align: center; }
        h2 { color: #0072ff; margin-top: 0; margin-bottom: 10px; }
        p { color: #555; font-size: 14px; line-height: 1.4; margin-bottom: 20px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px 15px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; outline: none; }
        input[type="text"]:focus, input[type="password"]:focus { border-color: #0072ff; }
        button { width: 100%; padding: 12px; background: #0072ff; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; margin-top: 10px; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #005bb5; }
        .footer { margin-top: 20px; font-size: 11px; color: #888; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Zona Wi-Fi</h2>
        <p>Abre tu Aplicación Móvil para conectar automáticamente o ingresa tu PIN manualmente a continuación.</p>

        $(if chap-id)
        <!-- Variables invisibles que lee tu App móvil -->
        <form name="sendin" action="$(link-login-only)" method="post">
            <input type="hidden" name="username" />
            <input type="hidden" name="password" />
            <input type="hidden" id="chap-id" name="chap-id" value="$(chap-id)" />
            <input type="hidden" id="chap-challenge" name="chap-challenge" value="$(chap-challenge)" />
            <input type="hidden" name="dst" value="$(link-orig)" />
            <input type="hidden" name="popup" value="true" />
        </form>

        <script type="text/javascript" src="md5.js"></script>
        <script type="text/javascript">
            function doLogin() {
                document.sendin.username.value = document.login.username.value;
                document.sendin.password.value = hexMD5('$(chap-id)' + document.login.password.value + '$(chap-challenge)');
                document.sendin.submit();
                return false;
            }
        </script>
        $(endif)

        <!-- Formulario manual web (con campo totalmente limpio) -->
        <form name="login" action="$(link-login-only)" method="post" $(if chap-id) onSubmit="return doLogin()" $(endif)>
            <input type="hidden" name="dst" value="$(link-orig)" />
            <input type="hidden" name="popup" value="true" />
            
            <input type="text" name="username" placeholder="Ingrese su PIN de ficha" value="" autocomplete="off" />
            <input type="password" name="password" placeholder="Contraseña (opcional)" value="" autocomplete="off" />
            
            $(if error)<div style="color:red; font-size:12px; margin:5px 0;">$(error)</div>$(endif)
            
            <button type="submit">Entrar a la Red</button>
        </form>

        <div class="footer">
            Copyright &copy; 2026 | Sistema de Acceso Wi-Fi
        </div>
    </div>
</body>
</html>
